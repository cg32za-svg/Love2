<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>หัวใจของฉัน</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050205;
    }

    body {
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: manipulation;
    }

    .heading {
      position: fixed;
      top: max(30px, env(safe-area-inset-top));
      left: 0;
      width: 100%;
      text-align: center;
      pointer-events: none;
      color: #fff0f4;
    }

    .heading h1 {
      margin: 0;
      font-size: clamp(22px, 5vw, 38px);
      font-weight: 500;
      letter-spacing: 2px;
      text-shadow: 0 0 24px #ff477e;
    }

    .heading p {
      margin-top: 10px;
      font-size: 13px;
      color: #d999ad;
    }

    .footer {
      position: fixed;
      bottom: max(25px, env(safe-area-inset-bottom));
      width: 100%;
      text-align: center;
      color: #bd8799;
      font-size: 12px;
      letter-spacing: 1px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="heart" aria-label="ข้อความรักเรียงเป็นรูปหัวใจ"></canvas>

  <header class="heading">
    <h1>Every word means you</h1>
    <p>ทุกคำว่ารัก…หมายถึงเธอ</p>
  </header>

  <footer class="footer">
    แตะหน้าจอเพื่อให้หัวใจส่งความรัก
  </footer>

  <script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    // แก้ข้อความได้ตรงนี้
    const words = [
      "ฉันรักเธอ",
      "I love you",
      "Je t’aime",
      "Te amo",
      "我爱你",
      "사랑해",
      "愛してる",
      "Ich liebe dich",
      "Ti amo",
      "Eu te amo",
      "Я тебя люблю",
      "Aku cinta kamu",
      "Seni seviyorum",
      "รักเธอนะ",
      "Always you"
    ];

    const colors = [
      "#ff335f",
      "#ff547d",
      "#ff789a",
      "#ff2445",
      "#ffd1df",
      "#ffffff"
    ];

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    let width;
    let height;
    let scale;
    let particles = [];
    let stars = [];
    let burst = 0;
    let lastTime = 0;
    let clock = 0;

    function heartPoint(t) {
      return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(
          13 * Math.cos(t)
          - 5 * Math.cos(2 * t)
          - 2 * Math.cos(3 * t)
          - Math.cos(4 * t)
        )
      };
    }

    function setup() {
      width = window.innerWidth;
      height = window.innerHeight;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      scale = Math.min(width / 43, height / 48);

      const count = width < 600 ? 230 : 360;

      particles = Array.from({ length: count }, (_, i) => {
        const t = Math.random() * Math.PI * 2;
        const point = heartPoint(t);

        // บางส่วนอยู่ขอบหัวใจ บางส่วนเติมด้านใน
        const radius = i < count * 0.3
          ? 0.94 + Math.random() * 0.06
          : Math.sqrt(Math.random()) * 0.94;

        return {
          x: point.x * radius,
          y: point.y * radius,
          z: (Math.random() - 0.5) * 9
            * Math.sqrt(1 - radius * radius),
          text: words[Math.floor(Math.random() * words.length)],
          color: colors[Math.floor(Math.random() * colors.length)],
          size: 0.65 + Math.random() * 0.65,
          phase: Math.random() * Math.PI * 2
        };
      });

      stars = Array.from({ length: 65 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.2 + 0.3,
        phase: Math.random() * Math.PI * 2
      }));
    }

    function draw(timestamp) {
      if (!lastTime) lastTime = timestamp;

      const delta = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;
      clock += delta;

      ctx.clearRect(0, 0, width, height);

      const centerX = width / 2;
      const centerY = height * 0.51;

      // แสงเรืองด้านหลัง
      const glow = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, scale * 24
      );

      glow.addColorStop(0, "rgba(125, 12, 49, 0.22)");
      glow.addColorStop(0.6, "rgba(65, 5, 30, 0.10)");
      glow.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      // จุดแสงเล็ก ๆ บนพื้นหลัง
      for (const star of stars) {
        const alpha = reducedMotion
          ? 0.3
          : 0.18 + (Math.sin(clock + star.phase) + 1) * 0.16;

        ctx.fillStyle = `rgba(255, 195, 216, ${alpha})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      const angle = reducedMotion ? 0.12 : clock * 0.24;
      const cos = Math.cos(angle);
      const sin = Math.sin(angle);

      const beat = reducedMotion
        ? 1
        : 1 + Math.pow(Math.max(0, Math.sin(clock * 3)), 8) * 0.065;

      burst *= Math.exp(-delta * 3.2);

      const spread = beat * (1 + burst * 0.75);

      // หมุนตำแหน่งในสามมิติ แล้วฉายลงบนหน้าจอ
      const projected = particles.map(p => {
        const x = p.x * cos + p.z * sin;
        const z = -p.x * sin + p.z * cos;
        const perspective = 65 / (65 - z);

        const floatY = reducedMotion
          ? 0
          : Math.sin(clock * 1.5 + p.phase) * 0.16;

        return {
          ...p,
          depth: z,
          perspective,
          screenX: centerX + x * scale * perspective * spread,
          screenY: centerY
            + (p.y + floatY) * scale * perspective * spread
        };
      });

      // วาดข้อความไกลก่อน ข้อความใกล้ทีหลัง
      projected.sort((a, b) => a.depth - b.depth);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const baseSize = Math.max(9, Math.min(16, width / 45));

      for (const p of projected) {
        const fontSize = baseSize * p.size * p.perspective;
        const alpha = Math.max(
          0.2,
          Math.min(1, (p.depth + 20) / 35)
        );

        ctx.globalAlpha = alpha;
        ctx.font = `600 ${fontSize}px Arial, sans-serif`;
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, p.screenX, p.screenY);
      }

      ctx.globalAlpha = 1;

      requestAnimationFrame(draw);
    }

    canvas.addEventListener("pointerdown", () => {
      if (!reducedMotion) burst = 1;
    });

    window.addEventListener("resize", setup);

    setup();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
